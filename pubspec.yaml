name: clashdeck
description: "Clash / mihomo 配置可视化编辑器"
publish_to: 'none'
version: 0.2.1+2072

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  path_provider: ^2.1.5
  file_picker: ^13.4.0

dev_dependencies:
  # 只给 tool/build_geosite_index.dart 算 sha256 用，不进 App 包。
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    # mihomo 的 GEOIP / GEOSITE 数据。首次启动时由 lib/runtime/geodata.dart
    # 复制到内核的 -d 目录，避免首次联网去 GitHub 下载（国内常常超时，
    # 超时会直接让设置 GEOIP 规则的配置启动失败）。
    - assets/geo/geoip.metadb
    - assets/geo/geosite.dat
    # 上面 dat 里有哪些名字，构建期扫成 JSON（tool/build_geosite_index.dart）。
    - assets/geo/geosite_index.json
  fonts:
    # 显示字体：标题、大号数值、状态标签。变量字体，字重通过 fontVariations 指定。
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    # 等宽字体：YAML、规则、日志、节点元信息。
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
