name: build

# 自动打包：
#   - push 到 main  → 构建开发版 APK，滚动更新到 Release「nightly」（预发布）
#   - push v* 标签  → 构建正式版 APK，发布到该标签的 Release
#   - 手动触发      → 填标签出正式版，留空出开发版
# 内核二进制不进仓库（118 MB、超 GitHub 单文件上限），所以每次都在 runner 上用 Go 现编。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v0.1.3）；留空则构建开发版'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            KIND=release
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            KIND=release
            TAG="${GITHUB_REF_NAME}"
          else
            KIND=dev
            TAG=nightly
          fi

          if [ "$KIND" = "release" ]; then
            NAME="${TAG#v}"
            PREFIX="ClashDeck-${NAME}"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}"
            PREFIX="ClashDeck-dev"
          fi

          {
            echo "kind=$KIND"
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "prefix=$PREFIX"
            echo "short_sha=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

          echo "类型：$KIND，版本：$NAME，发布标签：$TAG"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build mihomo core
        run: bash tool/build_core.sh
        env:
          ABIS: arm64-v8a x86_64

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # 测试失败时把关键行写进 job summary：匿名访问 run 页面也能看到失败
      # 用例名，不用登录下载日志。
      - name: Test
        run: |
          set -o pipefail
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            version="$(flutter --version 2>/dev/null | head -n 1 || true)"
            matches="$(grep -nE '\[E\]|Expected:|Actual:|Some tests failed|Exception|overflowed|Timed out|Test failed' "$RUNNER_TEMP/test.log" | head -n 100 || true)"
            if [ -z "$matches" ]; then
              matches="$(tail -n 80 "$RUNNER_TEMP/test.log")"
            fi
            {
              echo "## ❌ 测试失败"
              echo
              echo "- 提交：\`${GITHUB_SHA:0:7}\`"
              echo "- Flutter：\`${version}\`"
              echo "- 日志行数：\`$(wc -l < "$RUNNER_TEMP/test.log")\`"
              echo
              echo '```'
              echo "$matches"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64，本次用 debug 签名。每次 runner 生成的 debug key 都不同，装新版本必须先卸载旧版本。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "已配置正式签名（alias: ${KEY_ALIAS}）"

      - name: Build APK (split per ABI)
        run: |
          # 只出有内核的 ABI：armeabi-v7a 没有 libmihomo.so，打出来也用不了
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --build-name="${{ steps.v.outputs.name }}" \
            --build-number="${{ github.run_number }}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="${{ steps.v.outputs.prefix }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            case "$abi" in
              armeabi-v7a) continue ;;
            esac
            cp "$f" "dist/${prefix}-${abi}.apk"
          done
          ls -lh dist
          sha256sum dist/*.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.v.outputs.name }}
          path: dist/*.apk
          retention-days: 14

      - name: Show signer
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          for f in dist/*.apk; do
            echo "== $f"
            "$apksigner" verify --print-certs "$f" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          done

      - name: Compose release body
        env:
          KIND: ${{ steps.v.outputs.kind }}
          VERSION: ${{ steps.v.outputs.name }}
          SHORT_SHA: ${{ steps.v.outputs.short_sha }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            if [ "$KIND" != "release" ]; then
              echo "> 每次 push 到 main 都会自动覆盖这个开发版，包含最新的 main 代码，可能不稳定。"
              echo "> 稳定版请看 [最新正式版](https://github.com/${REPO}/releases/latest)。"
              echo
              echo "- 版本：\`${VERSION}\`（提交 \`${SHORT_SHA}\`）"
            else
              echo "- 版本：\`${VERSION}\`"
            fi
            echo
            echo "## 安装"
            echo
            echo "- \`arm64-v8a\`：绝大多数手机（推荐）"
            echo "- \`x86_64\`：模拟器 / 少数 x86 设备"
            echo
            echo "\`minSdk 24\`（Android 7.0 及以上）、\`targetSdk 36\`。APK 里已经带上 mihomo 内核与"
            echo "GEOIP/GEOSITE 数据，不用另外下载；首次启动会请求 VPN 授权，也可以只开本地代理端口。"
            echo
            echo "> 用 debug keystore 签名，仅用于试用；正式分发请自行配置签名密钥。"
            if [ "$KIND" = "release" ]; then
              echo
              echo "完整改动见 [CHANGELOG](https://github.com/${REPO}/compare/${TAG}...main) 或本页下方的自动生成说明。"
            fi
          } > body.md
          cat body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.kind == 'release' && format('ClashDeck {0}', steps.v.outputs.tag) || 'ClashDeck 开发版（跟随 main）' }}
          draft: false
          prerelease: ${{ steps.v.outputs.kind != 'release' }}
          make_latest: ${{ steps.v.outputs.kind == 'release' && 'true' || 'false' }}
          generate_release_notes: ${{ steps.v.outputs.kind == 'release' }}
          body_path: body.md
          files: dist/*.apk
